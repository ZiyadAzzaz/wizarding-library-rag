name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: ruff check backend frontend scripts
      - name: Test
        run: pytest -p no:cacheprovider
      - name: Compile
        run: python -m compileall -q backend frontend scripts

